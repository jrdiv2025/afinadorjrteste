<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Permissions-Policy" content="magnetometer=(self), accelerometer=(self)">
    <title>Detector de Metais Pro</title>
    <style>
        :root {
            --bg: #05070b;
            --panel: #0e121d;
            --border: #213354;
            --accent: #00d185;
            --warn: #ffb300;
            --danger: #ff3347;
            --text: #b8cce8;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: sans-serif;
            margin: 0; height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            overflow: hidden; touch-action: none;
        }
        header { width: 100%; padding: 15px; text-align: center; border-bottom: 1px solid var(--border); }
        h1 { margin: 0; font-size: 1.2rem; color: var(--accent); }
        
        main { flex: 1; display: flex; justify-content: center; align-items: center; position: relative; width: 100%; }
        
        #radar-container {
            position: relative; width: 320px; height: 320px;
            border-radius: 50%;
            background: radial-gradient(circle, #1a2236 0%, #05070b 70%);
            border: 2px solid var(--border);
            box-shadow: 0 0 30px rgba(0, 209, 133, 0.05);
        }
        .ring { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); border-radius: 50%; border: 1px solid rgba(33, 51, 84, 0.5); }
        .r1 { width: 25%; height: 25%; } .r2 { width: 50%; height: 50%; } .r3 { width: 75%; height: 75%; }
        
        #cursor {
            position: absolute; top: 50%; left: 50%;
            width: 14px; height: 14px; background-color: var(--accent);
            border-radius: 50%; transform: translate(-50%, -50%);
            box-shadow: 0 0 15px var(--accent); z-index: 10;
        }

        .ring-btn {
            position: absolute; width: 50px; height: 50px;
            background: var(--panel); border: 1px solid var(--border);
            border-radius: 50%; display: flex; justify-content: center; align-items: center;
            font-size: 1.2rem; color: var(--text); cursor: pointer; z-index: 5;
        }
        .ring-btn.active { background: var(--accent); color: #000; box-shadow: 0 0 15px var(--accent); }

        .controls { width: 100%; padding: 20px; background: var(--panel); border-top: 1px solid var(--border); text-align: center; }
        .info-display { font-size: 2rem; font-weight: bold; color: var(--accent); margin-bottom: 10px; }
        .sub-info { font-size: 0.9rem; color: var(--dim); margin-bottom: 15px; }
        
        button.action-btn {
            background: var(--accent); color: #000; border: none;
            padding: 12px 30px; border-radius: 8px; font-weight: bold; font-size: 1rem;
        }

        #permission-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 100;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
    </style>
</head>
<body>

    <header><h1>◈ DETECTOR PRO</h1></header>

    <main>
        <div id="radar-container">
            <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div>
            <div id="cursor"></div>
        </div>
    </main>

    <div class="controls">
        <div class="info-display" id="intensity-val">0 µT</div>
        <div class="sub-info" id="sensor-type">Sensor: Aguardando...</div>
        <button class="action-btn" onclick="startSensors()">ATIVAR SENSOR BRUTO</button>
    </div>

    <div id="permission-overlay">
        <h2 style="color: var(--accent)">Modo Detector</h2>
        <p>Este modo usa o sensor não-calibrado para maior sensibilidade.</p>
        <button class="action-btn" onclick="startSensors()">INICIAR</button>
    </div>

    <script>
        let magSensor;
        let baseIntensity = 0;
        const cursor = document.getElementById('cursor');
        const radar = document.getElementById('radar-container');
        const intensityDisplay = document.getElementById('intensity-val');
        const sensorTypeDisplay = document.getElementById('sensor-type');
        const overlay = document.getElementById('permission-overlay');

        // Cria botões decorativos
        const btns = ["⚙","📡","💾","📊","🔍","⚡","🔄","ℹ"];
        btns.forEach((icon, i) => {
            const el = document.createElement('div');
            el.className = 'ring-btn';
            el.innerHTML = icon;
            const angle = (i * 45) - 90;
            const rad = angle * (Math.PI / 180);
            el.style.left = `${160 + 140 * Math.cos(rad) - 25}px`;
            el.style.top = `${160 + 140 * Math.sin(rad) - 25}px`;
            document.getElementById('radar-container').appendChild(el);
        });

        async function startSensors() {
            // Tenta primeiro o Uncalibrated (mais sensível)
            if ('UncalibratedMagnetometer' in window) {
                try {
                    magSensor = new UncalibratedMagnetometer({ frequency: 60 });
                    sensorTypeDisplay.innerText = "Sensor: Não-Calibrado (Alta Sensibilidade)";
                } catch(e) { console.log("Falha no Uncalibrated"); }
            } 
            
            // Se falhar, usa o normal
            if (!magSensor && 'Magnetometer' in window) {
                magSensor = new Magnetometer({ frequency: 60 });
                sensorTypeDisplay.innerText = "Sensor: Padrão (Filtrado)";
            }

            if (magSensor) {
                magSensor.addEventListener('reading', () => {
                    overlay.style.display = 'none';
                    
                    // Pega os valores. Uncalibrated tem x,y,z e biasX,Y,Z
                    let x = magSensor.x;
                    let y = magSensor.y;
                    let z = magSensor.z;

                    // Calcula a magnitude total do campo magnético
                    const totalField = Math.sqrt(x*x + y*y + z*z);

                    // Se for a primeira leitura, define como base (campo da Terra)
                    if (baseIntensity === 0) {
                        baseIntensity = totalField;
                    }

                    // A diferença entre o atual e a base é o "metal"
                    let anomaly = Math.abs(totalField - baseIntensity);
                    
                    // Multiplicador para visualização
                    let displayVal = Math.round(anomaly * 10); 
                    if (displayVal > 100) displayVal = 100;

                    updateUI(displayVal, anomaly);
                });

                magSensor.addEventListener('error', (e) => {
                    alert("Erro no sensor: " + e.error.message);
                });

                magSensor.start();
            } else {
                alert("Seu navegador não suporta sensores magnéticos.");
            }
        }

        function updateUI(val, rawAnomaly) {
            intensityDisplay.innerText = `${val}%`;
            
            // Lógica de cor
            let color = 'var(--accent)';
            if (val > 20) color = 'var(--warn)';
            if (val > 50) color = 'var(--danger)';
            
            intensityDisplay.style.color = color;
            cursor.style.backgroundColor = color;
            cursor.style.boxShadow = `0 0 ${20 + val/2}px ${color}`;
            radar.style.borderColor = val > 50 ? 'var(--danger)' : 'var(--border)';

            // Simula movimento do cursor baseado na intensidade (vibração visual)
            if (val > 10) {
                const jitter = (Math.random() - 0.5) * (val / 2);
                cursor.style.transform = `translate(calc(-50% + ${jitter}px), calc(-50% + ${jitter}px))`;
            } else {
                cursor.style.transform = `translate(-50%, -50%)`;
            }

            // Destaca botões se estiver forte
            const allBtns = document.querySelectorAll('.ring-btn');
            if (val > 40) {
                allBtns[Math.floor(Math.random() * allBtns.length)].classList.add('active');
            } else {
                allBtns.forEach(b => b.classList.remove('active'));
            }
        }
    </script>
</body>
</html>
